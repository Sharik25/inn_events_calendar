# Builds and deploys the app to GitHub Pages on every push to main, and once a day.
# Where it is served is one setting, the repository variable CUSTOM_DOMAIN
# (Settings > Secrets and variables > Actions > Variables):
#   - unset: https://<owner>.github.io/<repo>/ (the app is built for that subpath);
#   - set, e.g. "almanac.example.com": that domain's root (also set it under Settings > Pages,
#     and point DNS at GitHub Pages; github.io then redirects there). See docs/custom-domain.md.
# The daily run keeps build-time output current without a push: the .ics feeds cover -1 to +18
# months from the build date. Editing a schedule-<year>.json on main redeploys right away.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC daily (off the hour: GitHub delays top-of-hour cron runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # BASE_PATH + SITE_URL from CUSTOM_DOMAIN (or the repo's github.io subpath): scripts/lib/site.ts
      - run: npx tsx scripts/site-env.ts | tee -a "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # validate-data + subscription feeds (with links back to the site) + app build
      - run: npm run build
      # Pages has no SPA rewrites: serve the app shell for deep links, and skip Jekyll.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
